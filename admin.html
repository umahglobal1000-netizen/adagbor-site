<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Adagbor Descendant Association</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #faf7f0; color: #222; }
  header { background: #1e4d2b; color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 18px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  #loginBox { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  #loginBox input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  #loginBox button, .actionBtn { background: #1e4d2b; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #loginBox button:hover, .actionBtn:hover { background: #163c21; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #f0ece1; position: sticky; top: 0; }
  tr:hover { background: #fafafa; }
  .status { padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .status.pending { background: #fff3cd; color: #856404; }
  .status.approved { background: #d4edda; color: #155724; }
  .status.rejected { background: #f8d7da; color: #721c24; }
  .tableScroll { overflow-x: auto; border: 1px solid #eee; border-radius: 6px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  select { padding: 4px; border-radius: 4px; border: 1px solid #ccc; }
  #error { color: #b00020; margin-top: 8px; }
  #count { color: #555; font-size: 14px; }
</style>
</head>
<body>

<header><h1>Adagbor Descendant Association — Admin</h1></header>

<div class="wrap">

  <div id="loginBox">
    <h2>Admin login</h2>
    <p>Enter the admin key to view membership applications.</p>
    <input type="password" id="adminKeyInput" placeholder="Admin key">
    <button onclick="login()">Log in</button>
    <div id="error"></div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="toolbar">
      <span id="count"></span>
      <button class="actionBtn" onclick="loadMembers()">Refresh</button>
    </div>
    <div class="tableScroll">
      <table id="membersTable">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Gender</th><th>DOB</th><th>Branch</th>
            <th>Occupation</th><th>Phone</th><th>Email</th><th>Address</th>
            <th>Next of kin</th><th>Kin phone</th><th>Status</th><th>Submitted</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="membersBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_BASE = "https://adagbor-api.umahglobal1000.workers.dev";
  let adminKey = "";

  async function login() {
    const key = document.getElementById('adminKeyInput').value.trim();
    if (!key) return;
    adminKey = key;
    const ok = await loadMembers();
    if (ok) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      sessionStorage.setItem('adminKey', adminKey);
    }
  }

  async function loadMembers() {
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    try {
      const res = await fetch(`${API_BASE}/api/admin/members`, {
        headers: { 'X-Admin-Key': adminKey }
      });
      if (res.status === 401) {
        errorEl.textContent = 'Incorrect admin key.';
        return false;
      }
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();
      renderMembers(data.members || []);
      return true;
    } catch (err) {
      errorEl.textContent = 'Could not load members. Check your connection and try again.';
      return false;
    }
  }

  function renderMembers(members) {
    document.getElementById('count').textContent = `${members.length} application(s)`;
    const body = document.getElementById('membersBody');
    body.innerHTML = '';
    members.forEach(m => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${m.id}</td>
        <td>${escapeHtml(m.full_name || '')}</td>
        <td>${escapeHtml(m.gender || '')}</td>
        <td>${escapeHtml(m.date_of_birth || '')}</td>
        <td>${escapeHtml(m.branch || '')}</td>
        <td>${escapeHtml(m.occupation || '')}</td>
        <td>${escapeHtml(m.phone || '')}</td>
        <td>${escapeHtml(m.email || '')}</td>
        <td>${escapeHtml(m.address || '')}</td>
        <td>${escapeHtml(m.next_of_kin_name || '')}</td>
        <td>${escapeHtml(m.next_of_kin_phone || '')}</td>
        <td><span class="status ${m.status}">${m.status}</span></td>
        <td>${escapeHtml(m.submitted_at || '')}</td>
        <td>
          <select onchange="updateStatus(${m.id}, this.value)">
            <option value="">Change...</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </td>
      `;
      body.appendChild(tr);
    });
  }

  async function updateStatus(id, status) {
    if (!status) return;
    try {
      await fetch(`${API_BASE}/api/admin/members`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
        body: JSON.stringify({ id, status })
      });
      loadMembers();
    } catch (err) {
      alert('Failed to update status.');
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  // Auto-login if key already stored this session
  window.addEventListener('DOMContentLoaded', () => {
    const stored = sessionStorage.getItem('adminKey');
    if (stored) {
      document.getElementById('adminKeyInput').value = stored;
      login();
    }
  });
</script>

</body>
</html>
