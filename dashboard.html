<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Adagbor Descendant Association</title>
<style>
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f5f0e1;
    color: #2f2a1f;
    margin: 0;
    padding: 30px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.4rem; color: #4a3f22; margin: 0; }
  button#logout {
    background: none;
    border: 1px solid #a33;
    color: #a33;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .card {
    background: #fff;
    border: 1px solid #d8cfae;
    border-radius: 8px;
    padding: 24px;
  }
  .profile-head {
    display: flex;
    gap: 18px;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee6d0;
  }
  .profile-photo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #d8cfae;
    background: #f5f0e1;
    flex-shrink: 0;
  }
  .profile-photo.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #a89b6e;
  }
  .profile-name { font-size: 1.15rem; font-weight: bold; color: #4a3f22; margin: 0 0 4px; }
  .profile-meta { font-size: 0.9rem; color: #7a6f4f; margin: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee6d0; }
  .row:last-child { border-bottom: none; }
  .row span:first-child { color: #7a6f4f; flex-shrink: 0; }
  .row span:last-child { font-weight: bold; text-align: right; }
  #loading, #error { text-align: center; color: #7a6f4f; }
  .error { color: #a33; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My Membership</h1>
    <button id="logout">Log out</button>
  </header>

  <div id="loading">Loading your details...</div>
  <div id="error" style="display:none" class="error"></div>
  <div id="content" style="display:none">
    <div class="card" id="fields"></div>
  </div>
</div>

<script>
const API_BASE = "https://adagbor-api.umahglobal1000.workers.dev";

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadMe() {
  try {
    const res = await fetch(`${API_BASE}/api/member/me`, { credentials: "include" });
    if (res.status === 401) {
      window.location.href = "login.html";
      return;
    }
    const data = await res.json();
    document.getElementById("loading").style.display = "none";

    if (!res.ok) {
      document.getElementById("error").textContent = data.error || "Could not load your details.";
      document.getElementById("error").style.display = "block";
      return;
    }

    const m = data.member;
    const fields = document.getElementById("fields");
    const photo = m.photo || m.photograph || m.avatar || '';
    const initial = (m.full_name || '?').trim().charAt(0).toUpperCase();

    const photoHtml = photo
      ? `<img class="profile-photo" src="${escapeHtml(photo)}" alt="Membership photo">`
      : `<div class="profile-photo placeholder" aria-hidden="true">${escapeHtml(initial)}</div>`;

    const rows = [
      ["Full name", m.full_name],
      ["Gender", m.gender],
      ["Date of birth", m.date_of_birth],
      ["Branch", m.branch],
      ["Occupation", m.occupation],
      ["Phone", m.phone],
      ["Email", m.email],
      ["Address", m.address],
      ["Next of kin", m.next_of_kin_name],
      ["Next of kin phone", m.next_of_kin_phone],
      ["Membership status", m.status],
    ].map(([label, value]) =>
      `<div class="row"><span>${label}</span><span>${escapeHtml(value || "—")}</span></div>`
    ).join("");

    fields.innerHTML = `
      <div class="profile-head">
        ${photoHtml}
        <div>
          <p class="profile-name">${escapeHtml(m.full_name || 'Member')}</p>
          <p class="profile-meta">${escapeHtml(m.branch || '')}${m.status ? ' · ' + escapeHtml(m.status) : ''}</p>
        </div>
      </div>
      ${rows}
    `;

    document.getElementById("content").style.display = "block";
  } catch (err) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").textContent = "Network error.";
    document.getElementById("error").style.display = "block";
  }
}

document.getElementById("logout").addEventListener("click", async () => {
  await fetch(`${API_BASE}/api/logout`, { method: "POST", credentials: "include" });
  window.location.href = "login.html";
});

loadMe();
</script>
</body>
</html>
