<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Adagbor Descendant Association</title>
<style>
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f5f0e1;
    color: #2f2a1f;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border: 1px solid #d8cfae;
    border-radius: 8px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; color: #4a3f22; }
  p.sub { color: #7a6f4f; margin-top: 0; margin-bottom: 24px; font-size: 0.95rem; }
  label { display: block; margin-bottom: 6px; font-weight: bold; }
  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid #c9bd93;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #5a4a1f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #443709; }
  #message { margin-top: 16px; font-size: 0.9rem; text-align: center; }
  .error { color: #a33; }
  .success { color: #2a7a2a; }
  a { color: #5a4a1f; }
</style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password</h1>
    <p class="sub">Enter the email you registered with, and we'll send you a reset link.</p>

    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <button type="submit">Send reset link</button>
    </form>

    <div id="message"></div>
    <p style="margin-top:16px;font-size:0.9rem"><a href="login.html">Back to login</a></p>
  </div>

<script>
const API_BASE = "https://adagbor-api.umahglobal1000.workers.dev";

document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("message");
  msg.textContent = "Sending...";
  msg.className = "";

  try {
    const res = await fetch(`${API_BASE}/api/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    msg.textContent = data.message || "If that email is registered, a reset link has been sent.";
    msg.className = res.ok ? "success" : "error";
  } catch (err) {
    msg.textContent = "Network error. Please try again.";
    msg.className = "error";
  }
});
</script>
</body>
</html>
