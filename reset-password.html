<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Adagbor Descendant Association</title>
<style>
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f5f0e1;
    color: #2f2a1f;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border: 1px solid #d8cfae;
    border-radius: 8px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; color: #4a3f22; }
  p.sub { color: #7a6f4f; margin-top: 0; margin-bottom: 24px; font-size: 0.95rem; }
  label { display: block; margin-bottom: 6px; font-weight: bold; }
  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid #c9bd93;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #5a4a1f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #443709; }
  #message { margin-top: 16px; font-size: 0.9rem; text-align: center; }
  .error { color: #a33; }
  .success { color: #2a7a2a; }
  a { color: #5a4a1f; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p class="sub">Choose a new password (minimum 8 characters).</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input type="password" id="password" required autocomplete="new-password">

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password">

      <button type="submit">Reset password</button>
    </form>

    <div id="message"></div>
    <p style="margin-top:16px;font-size:0.9rem"><a href="login.html">Back to login</a></p>
  </div>

<script>
const API_BASE = "https://adagbor-api.umahglobal1000.workers.dev";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const msg = document.getElementById("message");

if (!token) {
  msg.textContent = "Missing or invalid reset link. Please request a new one from the Forgot Password page.";
  msg.className = "error";
  document.getElementById("resetForm").style.display = "none";
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    msg.textContent = "Passwords do not match.";
    msg.className = "error";
    return;
  }
  if (password.length < 8) {
    msg.textContent = "Password must be at least 8 characters.";
    msg.className = "error";
    return;
  }

  msg.textContent = "Resetting...";
  msg.className = "";

  try {
    const res = await fetch(`${API_BASE}/api/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.error || "Could not reset password.";
      msg.className = "error";
      return;
    }

    msg.textContent = "Password updated! Redirecting to login...";
    msg.className = "success";
    setTimeout(() => { window.location.href = "login.html"; }, 2000);
  } catch (err) {
    msg.textContent = "Network error. Please try again.";
    msg.className = "error";
  }
});
</script>
</body>
</html>
